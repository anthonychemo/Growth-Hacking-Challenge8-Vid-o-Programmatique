# Worker de rendu — déclenché par l'Apps Script (API REST workflow_dispatch). Aucun clic manuel.
# Secrets du dépôt : WEBHOOK_URL (URL /exec) et WEBHOOK_TOKEN. Rien de personnel dans les inputs ni dans les logs.
name: render-video
run-name: render ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID_Execution de la ligne PRODUCTION"
        required: true
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: worker/requirements.txt
      - name: Dépendances système (ffmpeg, police Inter)
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core
      - name: Dépendances Python
        run: pip install -r worker/requirements.txt
      - name: Rendu, upload Drive et callback
        env:
          RUN_ID: ${{ inputs.run_id }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
        run: python worker/render.py --out "$RUNNER_TEMP/video.mp4"
